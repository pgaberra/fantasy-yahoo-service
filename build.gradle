plugins {
	id 'java'
	id 'org.springframework.boot' version '4.0.5'
	id 'io.spring.dependency-management' version '1.1.7'
	id 'jacoco'
}

group = 'com.fantasy'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(25)
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-actuator'

	// Database migrations
	// Spring Boot 4 split autoconfiguration into per-technology modules; the
	// Flyway integration (FlywayAutoConfiguration) lives in spring-boot-flyway,
	// which is no longer pulled in transitively by flyway-core alone.
	implementation 'org.springframework.boot:spring-boot-flyway'
	implementation 'org.flywaydb:flyway-core'
	implementation 'org.flywaydb:flyway-database-postgresql'

	// PostgreSQL driver (runtime)
	runtimeOnly 'org.postgresql:postgresql'

	// OpenAPI / Swagger UI
	implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.0.0'

	developmentOnly 'org.springframework.boot:spring-boot-devtools'

	// Tests run against in-memory H2 (no Docker needed in CI)
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
	testRuntimeOnly 'com.h2database:h2'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
	useJUnitPlatform()
	testLogging {
		events 'failed'
		exceptionFormat = 'full'
	}
	// Forward -DupdateSpec=true to the test JVM so OpenApiSpecSnapshotTest can
	// rewrite specs/openapi.yaml instead of asserting against it.
	systemProperty 'updateSpec', System.getProperty('updateSpec', 'false')
	finalizedBy jacocoTestReport
}

jacocoTestReport {
	dependsOn test
	reports {
		xml.required = true
		html.required = true
	}
}

// Only build the executable Spring Boot jar (skip the non-runnable "-plain" jar)
// so the Docker image can copy build/libs/*.jar unambiguously.
tasks.named('jar') {
	enabled = false
}
