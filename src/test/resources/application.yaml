spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    database-platform: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: false

# Mirror the main config's media type so the spec generated under test matches the
# committed specs/openapi.yaml (the test resources otherwise shadow application.yaml).
springdoc:
  default-produces-media-type: application/json
