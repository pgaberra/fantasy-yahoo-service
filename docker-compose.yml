services:
  postgres:
    # Same major version as the Coolify databases in staging and prod.
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: fantasy_yahoo
      POSTGRES_USER: fantasy
      POSTGRES_PASSWORD: fantasy
    ports:
      # Host port 5434 to avoid clashing with fantasy-db-service's Postgres on 5432.
      - "5434:5432"
    volumes:
      - postgres_yahoo_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fantasy -d fantasy_yahoo"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_yahoo_data:
