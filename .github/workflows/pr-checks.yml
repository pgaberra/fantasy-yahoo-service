name: PR Checks

on:
  # Not on push to master: a squash-merge lands byte-identical code to what the PR's own
  # pull_request run just tested, so a second full build+test here would be pure duplication.
  # The `protect-master` ruleset requires this check on a branch that is up to date with
  # master, so two PRs merging close together can't skip testing the second against the first.
  pull_request:
    branches: [master]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build, test & coverage
        run: ./gradlew build jacocoTestReport --no-daemon

      - name: Publish coverage report
        uses: Madrapps/jacoco-report@v1.8.0
        if: github.event_name == 'pull_request' && github.actor != 'dependabot[bot]'
        with:
          paths: '**/build/reports/jacoco/test/jacocoTestReport.xml'
          token: ${{ secrets.GITHUB_TOKEN }}
          min-coverage-overall: 0
          min-coverage-changed-files: 0
          title: 'Coverage Report — yahoo-service'
